  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  font-display: swap;\n  src: url(\"38dcd68c-b906-48b1-971b-15d348a3733b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Oswald';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fcf40465-468d-4585-aee3-467a1b56f840\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin */\n@font-face {\n  font-family: 'Share Tech Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"029e98a1-4586-4354-b31e-9929c8e80ffc\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    --red: #e60012;\n    --red-deep: #b00010;\n    --red-bg: #2a0509;\n    --black: #0a0708;\n    --ink: #120a0b;\n    --paper: #f3efe6;\n    --paper-dim: #cbbfb3;\n    --skew: -11deg;\n  }\n\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n\n  html, body { height: 100%; }\n\n  body {\n    background: var(--black);\n    color: var(--paper);\n    font-family: \"Oswald\", sans-serif;\n    overflow: hidden;\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* ============ STAGE ============ */\n  .stage {\n    position: fixed;\n    inset: 0;\n    overflow: hidden;\n  }\n\n  /* ============ BACKGROUND (this is where your collage goes) ============ */\n  /* Built from typographic \"graffiti\" + halftone + a heavy red/black\n     treatment so the busy art sits BEHIND the content. Swap the word-collage\n     layer for your real background image; keep the .bg-treatment overlay. */\n  .bg-base {\n    position: absolute;\n    inset: 0;\n    background:\n      radial-gradient(120% 120% at 30% 20%, #3a070d 0%, #220409 55%, #120203 100%);\n    z-index: 0;\n  }\n\n  .bg-words {\n    position: absolute;\n    inset: -10%;\n    z-index: 1;\n    overflow: hidden;\n    pointer-events: none;\n  }\n  .bg-words span {\n    position: absolute;\n    font-family: \"Anton\", sans-serif;\n    text-transform: uppercase;\n    color: rgba(255,255,255,0.045);\n    white-space: nowrap;\n    letter-spacing: -0.02em;\n    line-height: 0.8;\n  }\n  .bg-words span.outline {\n    color: transparent;\n    -webkit-text-stroke: 2px rgba(255,255,255,0.05);\n  }\n\n  /* halftone dots */\n  .bg-halftone {\n    position: absolute;\n    inset: 0;\n    z-index: 2;\n    background-image: radial-gradient(rgba(0,0,0,0.55) 1.2px, transparent 1.3px);\n    background-size: 7px 7px;\n    mix-blend-mode: multiply;\n    opacity: 0.5;\n  }\n\n  /* dark vignette + red multiply so content reads */\n  .bg-treatment {\n    position: absolute;\n    inset: 0;\n    z-index: 3;\n    background:\n      linear-gradient(90deg, rgba(8,2,3,0.92) 0%, rgba(8,2,3,0.35) 30%, rgba(8,2,3,0.15) 50%, rgba(8,2,3,0.6) 100%),\n      radial-gradient(140% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.7) 100%);\n  }\n\n  /* a few hard red diagonal slashes for energy */\n  .bg-slash {\n    position: absolute;\n    z-index: 4;\n    background: var(--red);\n    transform: skewX(var(--skew));\n    opacity: 0.9;\n    pointer-events: none;\n  }\n  .bg-slash.s1 { width: 46vw; height: 6px; top: 17%; left: -4vw; opacity:0.85; }\n  .bg-slash.s2 { width: 22vw; height: 3px; bottom: 12%; right: 8vw; background: var(--paper); opacity:0.5; }\n\n  /* ============ HUD CORNERS ============ */\n  .hud {\n    position: absolute;\n    z-index: 30;\n    font-family: \"Share Tech Mono\", monospace;\n    color: var(--paper-dim);\n    font-size: 13px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    opacity: 0;\n    animation: hudIn 0.5s ease forwards;\n  }\n  .hud .accent { color: var(--red); }\n  .hud-tr { top: 26px; right: 38px; text-align: right; line-height: 1.7; animation-delay: .5s; }\n  .hud-tr .title { font-family: \"Anton\", sans-serif; font-size: 22px; color: var(--paper); letter-spacing: 0.12em; }\n  .hud-tl { top: 28px; left: 40px; animation-delay: .6s; }\n  .hud-bl { bottom: 26px; left: 40px; display: flex; gap: 30px; animation-delay: .7s; }\n  .hud-br { bottom: 26px; right: 38px; animation-delay: .7s; }\n  .hud .key {\n    color: var(--black);\n    background: var(--paper);\n    padding: 2px 7px;\n    margin-right: 8px;\n    display: inline-block;\n    font-weight: 700;\n  }\n\n  /* ============ CHARACTER CARD (keep your portrait; restyle the frame) ============ */\n  .card {\n    position: absolute;\n    z-index: 20;\n    left: 8.5vw;\n    top: 50%;\n    width: 30vw;\n    min-width: 360px;\n    transform: translateY(-50%) translateX(-60px);\n    opacity: 0;\n    animation: cardIn 0.7s cubic-bezier(.2,.9,.2,1.15) forwards;\n    animation-delay: .25s;\n  }\n  .card__frame {\n    position: relative;\n    background: var(--red);\n    padding: 7px;\n    transform: skewX(-3deg) rotate(-1.2deg);\n    clip-path: polygon(0 2%, 100% 0, 99% 98%, 1% 100%);\n    box-shadow: 0 24px 60px rgba(0,0,0,0.6);\n  }\n  .card__photo {\n    position: relative;\n    aspect-ratio: 4 / 4.4;\n    background:\n      repeating-linear-gradient(135deg, #1a1416 0 14px, #221a1c 14px 28px);\n    overflow: hidden;\n    display: flex;\n    align-items: flex-end;\n    clip-path: polygon(0 2%, 100% 0, 99% 98%, 1% 100%);\n  }\n  .card__photo .slot-label {\n    font-family: \"Share Tech Mono\", monospace;\n    font-size: 12px;\n    letter-spacing: 0.2em;\n    color: rgba(255,255,255,0.4);\n    position: absolute;\n    top: 50%; left: 50%;\n    transform: translate(-50%,-50%);\n    text-transform: uppercase;\n  }\n  /* stat tags — fewer & tidier than the original (less clutter) */\n  .tag {\n    position: absolute;\n    background: var(--black);\n    color: var(--paper);\n    font-family: \"Anton\", sans-serif;\n    letter-spacing: 0.04em;\n    padding: 6px 12px;\n    transform: skewX(var(--skew));\n    box-shadow: 0 6px 16px rgba(0,0,0,0.5);\n  }\n  .tag > * { display: inline-block; transform: skewX(11deg); }\n  .tag .lvl { font-size: 13px; color: var(--paper-dim); font-family: \"Share Tech Mono\"; letter-spacing: 0.15em; }\n  .tag .big { font-size: 30px; line-height: 1; }\n  .tag .max { color: var(--red); }\n  .tag-rank { top: 18px; right: -10px; }\n  .tag-rank .row { display: flex; align-items: baseline; gap: 8px; }\n  .tag-name { bottom: 64px; left: -12px; background: var(--paper); color: var(--black); font-size: 15px; }\n  .card__caption {\n    margin-top: 18px;\n    font-family: \"Share Tech Mono\", monospace;\n    font-size: 13px;\n    letter-spacing: 0.45em;\n    color: var(--paper-dim);\n    text-align: center;\n    text-transform: uppercase;\n  }\n\n  /* ============ CALLOUT ============ */\n  .callout {\n    position: absolute;\n    z-index: 20;\n    left: 42vw;\n    bottom: 9vh;\n    transform: skewX(var(--skew)) translateY(40px);\n    background: var(--black);\n    padding: 14px 26px 16px;\n    opacity: 0;\n    box-shadow: 0 14px 40px rgba(0,0,0,0.6);\n    animation: calloutIn .6s cubic-bezier(.2,.9,.2,1.1) forwards;\n    animation-delay: .9s;\n  }\n  .callout > * { transform: skewX(11deg); }\n  .callout .kicker {\n    font-family: \"Share Tech Mono\", monospace;\n    font-size: 11px;\n    letter-spacing: 0.3em;\n    color: var(--red);\n    text-transform: uppercase;\n    display: block;\n    margin-bottom: 4px;\n  }\n  .callout .line {\n    font-family: \"Anton\", sans-serif;\n    font-size: clamp(20px, 1.6vw, 26px);\n    font-style: italic;\n    letter-spacing: 0.01em;\n    color: var(--paper);\n    line-height: 0.98;\n  }\n\n  /* ============ MENU ============ */\n  .menu {\n    position: absolute;\n    z-index: 25;\n    right: 0;\n    top: 50%;\n    transform: translateY(-50%);\n    width: 50vw;\n    padding-right: 6vw;\n  }\n  .menu__header {\n    position: relative;\n    margin-left: auto;\n    width: max-content;\n    padding-left: 18px;\n    margin-bottom: 20px;\n    opacity: 0;\n    animation: headerIn .6s cubic-bezier(.2,.9,.2,1.1) forwards;\n    animation-delay: .15s;\n  }\n  .menu__header h1 {\n    font-family: \"Anton\", sans-serif;\n    font-style: italic;\n    font-size: clamp(30px, 3vw, 46px);\n    letter-spacing: 0.04em;\n    transform: skewX(-6deg);\n    text-shadow: 4px 4px 0 var(--black);\n  }\n  .menu__header::before {\n    content: \"\";\n    position: absolute;\n    left: -2px; top: 6px; bottom: 6px;\n    width: 6px;\n    background: var(--red);\n    transform: skewX(var(--skew));\n  }\n  .menu__star {\n    position: absolute;\n    right: -2vw; top: -2.6vw;\n    font-family: \"Anton\", sans-serif;\n    font-size: 8vw;\n    color: rgba(230,0,18,0.16);\n    transform: rotate(-12deg);\n    pointer-events: none;\n    z-index: -1;\n  }\n\n  .menu__list {\n    display: flex;\n    flex-direction: column;\n    gap: 4px;\n    align-items: flex-end;\n  }\n\n  .item {\n    position: relative;\n    width: 100%;\n    border: none;\n    background: none;\n    color: inherit;\n    cursor: pointer;\n    padding: 8px 0;\n    display: flex;\n    align-items: center;\n    justify-content: flex-end;\n    transform: skewX(var(--skew)) translateX(80px);\n    opacity: 0;\n    will-change: transform;\n    animation: itemIn .55s cubic-bezier(.16,.9,.3,1.2) forwards;\n    transition: transform .16s cubic-bezier(.2,.8,.2,1);\n    font: inherit;\n    text-align: right;\n  }\n  .item:nth-child(1) { animation-delay: .30s; }\n  .item:nth-child(2) { animation-delay: .38s; }\n  .item:nth-child(3) { animation-delay: .46s; }\n  .item:nth-child(4) { animation-delay: .54s; }\n  .item:nth-child(5) { animation-delay: .62s; }\n  .item:nth-child(6) { animation-delay: .70s; }\n\n  /* the red selection slab */\n  .item__bar {\n    position: absolute;\n    inset: 0 -3vw 0 0;\n    background: var(--red);\n    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0% 100%);\n    transform: scaleX(0);\n    transform-origin: right center;\n    transition: transform .18s cubic-bezier(.2,.9,.2,1.2);\n    box-shadow: 0 10px 30px rgba(230,0,18,0.35);\n    z-index: -1;\n  }\n\n  .item__caret {\n    width: 0; height: 0;\n    border-style: solid;\n    border-width: 11px 0 11px 16px;\n    border-color: transparent transparent transparent var(--red);\n    margin-right: 18px;\n    opacity: 0;\n    transform: translateX(-12px);\n    transition: opacity .15s, transform .18s cubic-bezier(.2,.9,.2,1.4);\n  }\n\n  .item__num {\n    font-family: \"Share Tech Mono\", monospace;\n    font-size: 14px;\n    color: var(--paper-dim);\n    letter-spacing: 0.1em;\n    width: 34px;\n    order: 4;\n    transform: skewX(11deg);\n    transition: color .15s;\n  }\n\n  .item__label {\n    font-family: \"Anton\", sans-serif;\n    font-style: italic;\n    font-size: clamp(38px, 4vw, 64px);\n    line-height: 0.92;\n    letter-spacing: 0.01em;\n    color: var(--paper);\n    text-shadow: 3px 3px 0 var(--black);\n    transform: skewX(11deg);\n    transition: color .15s, font-size .16s;\n    order: 2;\n  }\n\n  .item__sub {\n    font-family: \"Share Tech Mono\", monospace;\n    font-size: 12px;\n    letter-spacing: 0.28em;\n    color: var(--paper-dim);\n    text-transform: uppercase;\n    margin-right: 22px;\n    transform: skewX(11deg);\n    order: 1;\n    transition: color .15s, opacity .15s;\n    opacity: 0.7;\n  }\n\n  /* base resting offset so the index number never clips the edge */\n  .item { transform: skewX(var(--skew)) translateX(-24px); }\n\n  /* hover / focus */\n  .item:hover { transform: skewX(var(--skew)) translateX(-40px); }\n  .item:hover .item__label { color: #fff; }\n  .item:hover .item__sub { color: var(--paper); opacity: 1; }\n\n  /* active state */\n  .item.is-active { transform: skewX(var(--skew)) translateX(-54px); }\n  .item.is-active .item__bar { transform: scaleX(1); }\n  .item.is-active .item__caret { opacity: 1; transform: translateX(0); border-left-color: #fff; }\n  .item.is-active .item__label { color: #fff; text-shadow: 3px 3px 0 var(--red-deep); }\n  .item.is-active .item__sub { color: #fff; opacity: 1; }\n  .item.is-active .item__num { color: #fff; }\n\n  /* jitter on the active item */\n  .item.is-active.jitter { animation: jitter .22s steps(2) 1; }\n\n  /* confirm flash */\n  .item.confirm .item__bar { animation: confirmFlash .4s ease; }\n\n  /* ============ KEYFRAMES ============ */\n  @keyframes hudIn { from { opacity: 0; } to { opacity: 1; } }\n  @keyframes headerIn {\n    from { opacity: 0; transform: translateX(60px) skewX(-6deg); }\n    to   { opacity: 1; transform: translateX(0) skewX(-6deg); }\n  }\n  @keyframes cardIn {\n    from { opacity: 0; transform: translateY(-50%) translateX(-70px) rotate(-2deg); }\n    to   { opacity: 1; transform: translateY(-50%) translateX(0) rotate(0); }\n  }\n  @keyframes calloutIn {\n    from { opacity: 0; transform: skewX(var(--skew)) translateY(46px); }\n    to   { opacity: 1; transform: skewX(var(--skew)) translateY(0); }\n  }\n  @keyframes itemIn {\n    0%   { opacity: 0; transform: skewX(var(--skew)) translateX(90px); }\n    70%  { opacity: 1; transform: skewX(var(--skew)) translateX(-38px); }\n    100% { opacity: 1; transform: skewX(var(--skew)) translateX(-24px); }\n  }\n  @keyframes jitter {\n    0%   { transform: skewX(var(--skew)) translate(-54px, 0); }\n    25%  { transform: skewX(var(--skew)) translate(-57px, -2px) rotate(-0.4deg); }\n    50%  { transform: skewX(var(--skew)) translate(-51px, 1px) rotate(0.3deg); }\n    75%  { transform: skewX(var(--skew)) translate(-55px, -1px); }\n    100% { transform: skewX(var(--skew)) translate(-54px, 0); }\n  }\n  @keyframes confirmFlash {\n    0%   { filter: brightness(1); transform: scaleX(1); }\n    30%  { filter: brightness(2.4); transform: scaleX(1.04); }\n    100% { filter: brightness(1); transform: scaleX(1); }\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    * { animation-duration: .01ms !important; animation-delay: 0ms !important; }\n    .card, .callout, .menu__header, .item, .hud { opacity: 1 !important; }\n    .item.is-active.jitter { animation: none; }\n  }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n  <main class=\"stage\" data-screen-label=\"Main Menu\">\n\n    <!-- BACKGROUND: replace word-collage with your real image; keep treatment -->\n    <div class=\"bg-base\"><\u002Fdiv>\n    <div class=\"bg-words\" aria-hidden=\"true\">\n      <span class=\"outline\" style=\"top:4%; left:2%; font-size:11vw; transform:rotate(-4deg);\">TAKE OVER<\u002Fspan>\n      <span style=\"top:30%; right:3%; font-size:13vw; transform:rotate(3deg);\">READY<\u002Fspan>\n      <span class=\"outline\" style=\"top:54%; left:1%; font-size:10vw; transform:rotate(-6deg);\">JUSTICE<\u002Fspan>\n      <span style=\"bottom:6%; left:18%; font-size:12vw; transform:rotate(2deg);\">RESISTANCE<\u002Fspan>\n      <span class=\"outline\" style=\"bottom:2%; right:2%; font-size:11vw; transform:rotate(-3deg);\">BREAK FREE<\u002Fspan>\n      <span style=\"top:2%; left:46%; font-size:9vw; transform:rotate(5deg);\">WAKE UP<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"bg-halftone\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"bg-treatment\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"bg-slash s1\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"bg-slash s2\" aria-hidden=\"true\"><\u002Fdiv>\n\n    <!-- HUD -->\n    <div class=\"hud hud-tr\">\n      <div class=\"title\">PORTFOLIO <span class=\"accent\">//<\u002Fspan> 2026<\u002Fdiv>\n      <div>SYS_V1.04 &nbsp;NODE —<\u002Fdiv>\n      <div>CH 06<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hud hud-tl\">// <span class=\"accent\">SELECT<\u002Fspan> MENU<\u002Fdiv>\n    <div class=\"hud hud-bl\">\n      <span><span class=\"key\">↑↓<\u002Fspan>NAVIGATE<\u002Fspan>\n      <span><span class=\"key\">ENTER<\u002Fspan>CONFIRM<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"hud hud-br\"><span class=\"key\">ESC<\u002Fspan>EXIT MODE<\u002Fdiv>\n\n    <!-- CHARACTER CARD -->\n    <section class=\"card\" aria-label=\"Profile card\">\n      <div class=\"card__frame\">\n        <div class=\"card__photo\">\n          <span class=\"slot-label\">[ YOUR PORTRAIT ]<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"tag tag-rank\">\n          <div class=\"row\"><span class=\"lvl\">RANK<\u002Fspan><span class=\"big\">08<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tag tag-name\"><span>THE STRATEGIST<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card__caption\">ARCANA — THE STRATEGIST<\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- CALLOUT -->\n    <aside class=\"callout\">\n      <span class=\"kicker\">// CODE OF CONDUCT<\u002Fspan>\n      <div class=\"line\">EVERY DAY IS<br>AN INVESTMENT.<\u002Fdiv>\n    <\u002Faside>\n\n    <!-- MENU -->\n    <nav class=\"menu\" aria-label=\"Main menu\">\n      <div class=\"menu__header\">\n        <span class=\"menu__star\" aria-hidden=\"true\">★<\u002Fspan>\n        <h1>MAIN MENU<\u002Fh1>\n      <\u002Fdiv>\n      <div class=\"menu__list\" id=\"menuList\">\n        <button class=\"item\" data-page=\"home\">\n          <span class=\"item__bar\" aria-hidden=\"true\"><\u002Fspan>\n          <span class=\"item__sub\">PROFILE<\u002Fspan>\n          <span class=\"item__label\">HOME<\u002Fspan>\n          <span class=\"item__num\">01<\u002Fspan>\n          <span class=\"item__caret\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"item\" data-page=\"work\">\n          <span class=\"item__bar\" aria-hidden=\"true\"><\u002Fspan>\n          <span class=\"item__sub\">PROJECTS<\u002Fspan>\n          <span class=\"item__label\">WORK<\u002Fspan>\n          <span class=\"item__num\">02<\u002Fspan>\n          <span class=\"item__caret\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"item\" data-page=\"about\">\n          <span class=\"item__bar\" aria-hidden=\"true\"><\u002Fspan>\n          <span class=\"item__sub\">INFO<\u002Fspan>\n          <span class=\"item__label\">ABOUT<\u002Fspan>\n          <span class=\"item__num\">03<\u002Fspan>\n          <span class=\"item__caret\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"item is-active\" data-page=\"journal\">\n          <span class=\"item__bar\" aria-hidden=\"true\"><\u002Fspan>\n          <span class=\"item__sub\">EXPERIENCE<\u002Fspan>\n          <span class=\"item__label\">JOURNAL<\u002Fspan>\n          <span class=\"item__num\">04<\u002Fspan>\n          <span class=\"item__caret\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"item\" data-page=\"contact\">\n          <span class=\"item__bar\" aria-hidden=\"true\"><\u002Fspan>\n          <span class=\"item__sub\">REACH OUT<\u002Fspan>\n          <span class=\"item__label\">CONTACT<\u002Fspan>\n          <span class=\"item__num\">05<\u002Fspan>\n          <span class=\"item__caret\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"item\" data-page=\"system\">\n          <span class=\"item__bar\" aria-hidden=\"true\"><\u002Fspan>\n          <span class=\"item__sub\">CONFIG<\u002Fspan>\n          <span class=\"item__label\">SYSTEM<\u002Fspan>\n          <span class=\"item__num\">06<\u002Fspan>\n          <span class=\"item__caret\" aria-hidden=\"true\"><\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fnav>\n  <\u002Fmain>\n\n  <script>\n    (function () {\n      const items = Array.from(document.querySelectorAll('.item'));\n      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      let active = items.findIndex(i => i.classList.contains('is-active'));\n      if (active < 0) active = 0;\n\n      function setActive(idx, doJitter) {\n        active = (idx + items.length) % items.length;\n        items.forEach((it, i) => {\n          it.classList.toggle('is-active', i === active);\n          if (i !== active) it.classList.remove('jitter');\n        });\n        const el = items[active];\n        if (doJitter && !reduce) {\n          el.classList.remove('jitter');\n          void el.offsetWidth; // reflow to restart animation\n          el.classList.add('jitter');\n        }\n      }\n\n      function confirm() {\n        const el = items[active];\n        el.classList.add('confirm');\n        setTimeout(() => el.classList.remove('confirm'), 420);\n        // hand off to your router here, e.g. location.hash = el.dataset.page;\n      }\n\n      items.forEach((it, i) => {\n        it.addEventListener('mouseenter', () => setActive(i, true));\n        it.addEventListener('click', () => { setActive(i, true); confirm(); });\n      });\n\n      window.addEventListener('keydown', (e) => {\n        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); setActive(active + 1, true); }\n        else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); setActive(active - 1, true); }\n        else if (e.key === 'Enter') { e.preventDefault(); confirm(); }\n      });\n    })();\n  <\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
